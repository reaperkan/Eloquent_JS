<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
</head>
<body>
    <h1>Home Page</h1>
    <p>Hello World</p>
    <p>Reading this book <a href="http://eloquentjavascript.net"> Eloquent Js </a></p>

    <p>One</p>
    <p>Two</p>
    <p>Three</p>

    <p> The <img src="img/cat.jpg" alt="Cat" /></p>
    <p><button onclick="replaceImages()">Replace</button></p>

    <blockquote id="quote">
        No book can ever be finished.
        While working on it we learn just enough to find it 
        immature the moment we turn away from it.
    </blockquote>

    <p style="text-align: center;">
        <div id="test" style="background-color: red; height: 40px; width: 40px; position: relative;"></div>
    </p>
    <script>
        function elt(type, ...children){
            let node = document.createElement(type);
            for(let child of children){
                if(typeof child != "string"){
                    node.appendChild(child);
                }else{
                    node.appendChild(document.createTextNode(child));
                }
            }
            return node;
        }
        function replaceImages(){
            let images = document.body.getElementsByTagName("img");
            for(let i = images.length - 1; i >= 0; i--){
                let image = images[i];
                if(image.alt){
                    let text = document.createTextNode(image.alt);
                    image.parentNode.replaceChild(text, image);
                }
            }
        }
        function talksAbout(node, string){
            if(node.nodeType == Node.ELEMENT_NODE){
                for(let child of node.childNodes){
                    if(talksAbout(child, string))
                        return true;
                }
                return false;
            }else if(node.nodeType == Node.TEXT_NODE){
                return node.nodeValue.indexOf(string) > -1;
            }
        }

        console.log(talksAbout(document.body, "book"));

        let link = document.body.getElementsByTagName("a")[0];
        console.log(link.href);

        let paras = document.getElementsByTagName("p");
        document.body.insertBefore(paras[4], paras[2]);

        console.log("Client Height: ", paras[1].clientHeight);
        console.log("Offset Height: ", paras[1].offsetHeight);

        document.getElementById("quote")
                .appendChild(
                    elt("footer", "-", 
                        elt("strong", "Karl Popper"), 
                        ", preface to the scond edition of ",
                        elt("em", "The Open Socients and Its Enemies"), ", 1950"));

        let testBox = document.getElementById("test");
        let angle = Math.PI / 2;

        function animate(time, lastTime){
            if(lastTime != null){
                angle+= (time - lastTime) * 0.0001;
            }
            testBox.style.top = (Math.sin(angle) * 20) + "px";
            testBox.style.left = (Math.cos(angle) * 20) + "px";
            requestAnimationFrame(newTime => animate(newTime, time));
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
