<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
</head>
<body>
    <p>Normal HTML here</p>
    <svg xmlns="http://www.w3.org/2000/svg">
        <circle r="50" cx="50" cy="50" fill="red" />
        <rect x="120" y="5" width="90" height="90" stroke="blue" fill="none"/>
    </svg>
    
    <p>Before Canvas</p>
    <canvas></canvas>
    <script>
        let circleSVG = document.querySelector("circle");
        circleSVG.setAttribute("fill", "cyan");

        let canvas = document.querySelector("canvas");
        let context = canvas.getContext("2d");
        context.fillStyle = "red";
        context.fillRect(10, 10, 100, 50);

        context.strokeStyle = "blue";
        context.strokeRect(5, 5, 50, 50);
        context.lineWidth = 5;
        context.strokeRect(135, 5, 50, 50);

        context.beginPath();
        for(let y=0; y<100; y+=10){
            context.moveTo(10, y);
            context.lineTo(90, y);
        }
        context.stroke();

        context.beginPath();
        context.moveTo(50, 10);
        context.lineTo(10, 70);
        context.lineTo(90, 70);
        context.fill();

        context.beginPath();
        context.moveTo(50, 10);
        context.lineTo(10, 70);
        context.lineTo(90, 70);
        context.closePath();
        context.stroke();
    </script>
</body>
</html>
