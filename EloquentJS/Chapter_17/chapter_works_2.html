<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas 2</title>
</head>
<body>
    <canvas></canvas>

    <script>
        let canvas = document.querySelector("canvas");
        let ctx = canvas.getContext("2d");

        ctx.beginPath();
        ctx.moveTo(10, 90);
        // control = 60,10
        // goal = 90,90
        ctx.quadraticCurveTo(60, 10, 90, 90);

        ctx.lineTo(60, 10);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(10, 90);
        // control1 = 10,10
        // control2 = 90,10
        // goal = 50, 90
        ctx.bezierCurveTo(10,10, 90, 10, 50, 90);
        ctx.lineTo(90, 10);
        ctx.lineTo(10, 10);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        // center = 50,50
        // radius = 40
        // angel = 0 to 7
        ctx.arc(50,50,40, 0, 7);
        // center = 150, 50
        // radius - 40
        // angel 0 to 1/2pi
        ctx.arc(150, 50, 40, 0, 0.5 * Math.PI);
        ctx.stroke();
    </script>
</body>
</html>
